[package]
name = "nxcore"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
directories = "6"
flate2 = "1"
futures = "0.3"
liblzma = { version = "0.4", features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tar = "0.4"
qrcode = { version = "0.14", default-features = false }
zstd = "0.13"
# the read-only certificate export (as p12_export): the stored key matched against Apple's list
rsa = "0.9.10"
x509-cert = "0.2.5"
sha2 = "0.11"
# updates from the GitHub release: the manifest's ed25519 signature (update.rs)
ed25519-dalek = "2"
# Apple sign-in and installing: the same libraries and features as iloader 2.4.0
isideload = { version = "0.5.0", features = ["fs-storage"] }
idevice = { version = "0.1.68", features = ["usbmuxd", "house_arrest", "installation_proxy", "crashreportcopymobile"] }
# copying into LiveContainer over USB: the IPA read entry by entry, LiveContainer's LCAppInfo.plist kept across updates
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
plist = "1"
# reqwest comes through isideload with rustls-no-provider: the process installs aws-lc-rs itself (as iloader does)
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }

# LiveContainer's own IPA from its GitHub release (more RAM: signed again); TLS as isideload has it on each platform
[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "system-proxy"] }

[features]
# tests of updates only (never in a release): PUBLIC_KEY is NXNATIVEV2_TEST_PUBLIC_KEY, given at build time
test-update-key = []
